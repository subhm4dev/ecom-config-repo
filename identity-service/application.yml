server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecom_iam}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  issuer: ecom-identity
  access-token:
    expiry-hours: 2  # 2 hours - short for security, auto-refreshed seamlessly via refresh token
  refresh-token:
    expiry-days: 30  # 30 days - full session lifetime (like Amazon, Blinkit, etc.)

logging:
  level:
    root: INFO
    com.ecom: DEBUG
    org.springframework.security: DEBUG

