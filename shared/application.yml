# Shared configuration for all services

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ecom-services
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Actuator & Monitoring Configuration
# This configuration is shared across ALL microservices via Config Server
# Any service-specific overrides go in their respective application.yml files
management:
  endpoints:
    web:
      exposure:
        # Standard endpoints exposed to all services
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized  # Show details only when authorized (secure by default)
      probes:
        enabled: true  # Enable Kubernetes liveness/readiness probes
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}  # Tag all metrics with service name
      environment: ${ENVIRONMENT:local}
  health:
    # Health indicators enabled by default:
    # - db (when using JPA)
    # - diskspace
    # - ping
    # Custom health checks can be added per service
    diskspace:
      enabled: true
    db:
      enabled: true
  info:
    env:
      enabled: true  # Include environment info
    java:
      enabled: true  # Include Java version info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN

