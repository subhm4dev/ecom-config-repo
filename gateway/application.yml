server:
  port: 8080

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: http://localhost:8081
              predicates:
                - Path=/identity/**
              filters:
                - StripPrefix=0
            - id: identity-service-auth
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - StripPrefix=0
            - id: identity-service-well-known
              uri: http://localhost:8081
              predicates:
                - Path=/.well-known/**
              filters:
                - StripPrefix=0
            - id: user-profile-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/profile/**
              filters:
                - StripPrefix=0
            - id: address-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/address/**
              filters:
                - StripPrefix=0
            - id: catalog-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/product/**
              filters:
                - StripPrefix=0
            - id: catalog-service-category
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/category/**
              filters:
                - StripPrefix=0
            - id: inventory-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/inventory/**
              filters:
                - StripPrefix=0
            - id: promo-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/v1/promotion/**
              filters:
                - StripPrefix=0
            - id: cart-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/v1/cart/**
              filters:
                - StripPrefix=0
            - id: checkout-service
              uri: http://localhost:8088
              predicates:
                - Path=/api/v1/checkout/**
              filters:
                - StripPrefix=0
            - id: payment-service
              uri: http://localhost:8089
              predicates:
                - Path=/api/v1/payment/**
              filters:
                - StripPrefix=0
            - id: order-service
              uri: http://localhost:8090
              predicates:
                - Path=/api/v1/order/**
              filters:
                - StripPrefix=0
            - id: fulfillment-service
              uri: http://localhost:8091
              predicates:
                - Path=/api/v1/fulfillment/**
              filters:
                - StripPrefix=0
            - id: delivery-service
              uri: http://localhost:8091
              predicates:
                - Path=/api/v1/delivery/**
              filters:
                - StripPrefix=0
            - id: driver-service
              uri: http://localhost:8091
              predicates:
                - Path=/api/v1/driver/**
              filters:
                - StripPrefix=0
            - id: delivery-providers-service
              uri: http://localhost:8091
              predicates:
                - Path=/api/v1/delivery-providers/**
              filters:
                - StripPrefix=0
            - id: public-tracking-service
              uri: http://localhost:8091
              predicates:
                - Path=/api/v1/public/tracking/**
              filters:
                - StripPrefix=0
            - id: public-delivery-service
              uri: http://localhost:8091
              predicates:
                - Path=/api/v1/public/delivery/**
              filters:
                - StripPrefix=0
            - id: search-service
              uri: http://localhost:8092
              predicates:
                - Path=/api/v1/search/**
              filters:
                - StripPrefix=0
            - id: recommendations-service
              uri: http://localhost:8092
              predicates:
                - Path=/api/v1/recommendations/**
              filters:
                - StripPrefix=0
            - id: search-history-service
              uri: http://localhost:8092
              predicates:
                - Path=/api/v1/search/history/**
              filters:
                - StripPrefix=0

  # Redis for token blacklisting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Gateway JWT Configuration
gateway:
  jwt:
    enabled: true  # Required for ReactiveJwtValidationAutoConfiguration
  public-paths:
    # Public auth endpoints (accessible without authentication)
    - /api/v1/auth/register      # Public: New users can register
    - /api/v1/auth/login          # Public: Users can login (get tokens)
    - /api/v1/auth/refresh        # Public: Users can refresh expired tokens
    # NOTE: /api/v1/auth/logout and /api/v1/auth/logout-all are NOT public
    # They require authentication - Gateway will validate token before allowing access
    
    # Other public endpoints
    - /.well-known/**             # Public: JWKS endpoint (for token validation)
    - /actuator/**                # Public: Health checks and monitoring
    - /swagger-ui/**              # Public: API documentation UI
    - /v3/api-docs/**             # Public: OpenAPI specification
    - /swagger-ui.html            # Public: Swagger UI redirect
    
    # Public catalog endpoints (browsing without authentication)
    # Only 3 endpoints are public (GET only):
    # 1. GET /api/v1/category - Get all categories
    # 2. GET /api/v1/product/search - Search/get all products
    # 3. GET /api/v1/product/{id} - Get product by ID
    # Note: Gateway doesn't support HTTP method matching in public-paths,
    # so we rely on the catalog service to enforce method restrictions.
    # The catalog service will reject non-GET requests to these paths.
    - /api/v1/product/search
    - /api/v1/product/*  # Matches /api/v1/product/{id} (UUID). Note: Also matches /api/v1/product/search, but that's OK since catalog service enforces GET-only
    - /api/v1/category
    
    # Public search endpoints
    - /api/v1/search
    - /api/v1/search/autocomplete
    - /api/v1/search/category/**
    - /api/v1/search/subcategory/**
    - /api/v1/recommendations/trending
    
    # Public tracking endpoints (no authentication required)
    - /api/v1/public/tracking/**
    - /api/v1/public/delivery/**

# JWT Validation Configuration (for jwt-validation-starter shared library)
# Maps to JwtValidationProperties with 'jwt' prefix
jwt:
  identity-service-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  jwks-endpoint: /.well-known/jwks.json
  jwks-cache-refresh-interval-ms: ${JWKS_CACHE_REFRESH_INTERVAL_MS:300000}  # 5 minutes in milliseconds

logging:
  level:
    root: INFO
    com.ecom: DEBUG

