server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: http://localhost:8081
          predicates:
            - Path=/identity/**,/auth/**
          filters:
            - StripPrefix=0
        - id: user-profile-service
          uri: http://localhost:8082
          predicates:
            - Path=/profile/**
          filters:
            - StripPrefix=0
        - id: address-service
          uri: http://localhost:8083
          predicates:
            - Path=/address/**
          filters:
            - StripPrefix=0
        - id: catalog-service
          uri: http://localhost:8084
          predicates:
            - Path=/catalog/**
          filters:
            - StripPrefix=0
        - id: inventory-service
          uri: http://localhost:8085
          predicates:
            - Path=/inventory/**
          filters:
            - StripPrefix=0

logging:
  level:
    root: INFO
    com.ecom: DEBUG

