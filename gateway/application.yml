server:
  port: 8080

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: http://localhost:8081
              predicates:
                - Path=/identity/**,/auth/**
              filters:
                - StripPrefix=0
            - id: identity-service-well-known
              uri: http://localhost:8081
              predicates:
                - Path=/.well-known/**
              filters:
                - StripPrefix=0
            - id: user-profile-service
              uri: http://localhost:8082
              predicates:
                - Path=/profile/**
              filters:
                - StripPrefix=0
            - id: address-service
              uri: http://localhost:8083
              predicates:
                - Path=/address/**
              filters:
                - StripPrefix=0
            - id: catalog-service
              uri: http://localhost:8084
              predicates:
                - Path=/catalog/**
              filters:
                - StripPrefix=0
            - id: inventory-service
              uri: http://localhost:8085
              predicates:
                - Path=/inventory/**
              filters:
                - StripPrefix=0
            - id: promo-service
              uri: http://localhost:8086
              predicates:
                - Path=/promo/**,/promotion/**
              filters:
                - StripPrefix=0
            - id: cart-service
              uri: http://localhost:8087
              predicates:
                - Path=/cart/**
              filters:
                - StripPrefix=0
            - id: checkout-service
              uri: http://localhost:8088
              predicates:
                - Path=/checkout/**
              filters:
                - StripPrefix=0
            - id: payment-service
              uri: http://localhost:8089
              predicates:
                - Path=/payment/**
              filters:
                - StripPrefix=0
            - id: order-service
              uri: http://localhost:8090
              predicates:
                - Path=/order/**
              filters:
                - StripPrefix=0

  # Redis for token blacklisting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Gateway JWT Configuration
gateway:
  jwt:
    identity-service-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
    jwks-endpoint: /.well-known/jwks.json
    jwks-cache-refresh-interval-ms: ${JWKS_CACHE_REFRESH_INTERVAL_MS:300000}  # 5 minutes in milliseconds
  public-paths:
    - /api/auth/**
    - /.well-known/**
    - /actuator/**
    - /swagger-ui/**
    - /v3/api-docs/**
    - /swagger-ui.html

logging:
  level:
    root: INFO
    com.ecom: DEBUG

